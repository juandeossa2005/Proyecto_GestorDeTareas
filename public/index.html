<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi gestor de tareas</title>
<style>
:root{--bg:#f5f5f7;--sf:#fff;--tx:#1e1e24;--mu:#6e6e7e;--ln:#e0e0e8;--ac:#2f7de1;--rd:#d13b4f;--gr:#2e8b57;--am:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--sf:#252525;--tx:#ececf1;--mu:#9a9aab;--ln:#38383f;--ac:#4a9bff;--rd:#ff7185;--gr:#5fd08f;--am:#f0b34a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191919;--sf:#252525;--tx:#ececf1;--mu:#9a9aab;--ln:#38383f;--ac:#4a9bff;--rd:#ff7185;--gr:#5fd08f;--am:#f0b34a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{border-right:1px solid var(--ln);padding:18px 10px;background:var(--sf)}
nav h1{font-size:16px;margin:0 8px 12px}
.cat{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:6px;color:var(--tx)}
.cat.on{background:var(--bg);font-weight:600}.cat .n{margin-left:auto;color:var(--mu);font-size:12px}
.cat i{width:4px;border-radius:2px;flex:none}
main{padding:20px 22px 60px;max-width:860px;width:100%}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:7px 13px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--rd)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;width:100%}
h2{margin:0 0 12px;font-size:24px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chips button{border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mu)}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.gh{margin:20px 0 6px;font-weight:600;color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;margin-bottom:5px}
.row input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--gr)}
.row .t{flex:1;text-align:left;border:0;background:none;padding:2px 0;min-width:0}
.row.dn .t{text-decoration:line-through;color:var(--mu)}
.b{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.late{color:var(--rd)}.up{color:var(--ac)}.dn2{color:var(--gr)}.pa{color:var(--rd)}.pm{color:var(--am)}.pb{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px 0}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);width:min(560px,94vw);max-height:92vh;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;margin-bottom:6px}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--ln);display:flex;gap:4px;overflow-x:auto;padding:10px}nav h1{display:none}.cat{width:auto;white-space:nowrap}main{padding:16px 12px 60px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main>
<h2 id="ttl">Cargando...</h2>
<div class="bar"><input id="q" placeholder="Buscar..." aria-label="Buscar"></div>
<div class="bar"><input id="qa" placeholder="Agregar tarea rápida (sin plazo)" aria-label="Tarea rápida"><button class="p" id="qb">Agregar</button><button id="full">Con detalles</button></div>
<div class="chips" id="chips"></div>
<div id="list"></div></main></div>
<dialog id="dlg"></dialog>
<script>
var KEY="gestor-v1",S=null,cur="all",flt="all",q="",draft=null,mode="";

function T(t,c,g,x){x=x||{};return{id:"s"+Math.random().toString(36).slice(2,9),title:t,cat:c,grp:g||"",due:x.due||"",pri:x.pri||"",desc:x.desc||"",fields:x.fields||[],done:false}}
if(!S){S={cats:[{id:"med",name:"Citas médicas",icon:"🩺",color:"#e5484d"},{id:"mini",name:"Mini tareas",icon:"✅",color:"#2f7de1"}],tasks:[
T("Consulta de primera vez por psicología","med","Generales",{desc:"Pedir cita dentro de 6 meses.",fields:[{k:"Tipo",v:"Consulta paramédica"}]}),
T("Medicina general","med","Generales",{desc:"Pedir cita dentro de un mes después de usar el medicamento."}),
T("Laboratorio clínico: hemograma IV","med","Generales",{due:"2026-09-05T08:00",desc:"Hemoglobina, hematocrito, recuento de eritrocitos, leucograma, plaquetas y morfología electrónica (automatizado).",fields:[{k:"Tipo",v:"Laboratorio clínico"}]}),
T("Control por nutrición y dietética","med","Generales",{due:"2026-11-20T08:30",fields:[{k:"Tipo",v:"Consulta paramédica"}]}),
T("Control por medicina general (programa de obesidad)","med","Generales",{due:"2026-12-07T08:00",fields:[{k:"Tipo",v:"Consulta externa"}]}),
T("Control por especialista en corneología","med","Ojos",{desc:"Pedir cita en 6 meses."}),
T("Consulta de optometría especializada por contactología","med","Ojos"),
T("Topografía computada corneal por elevación bilateral","med","Ojos"),
T("Practicar y estudiar SQL","mini","Estudio"),T("Practicar y estudiar inglés","mini","Estudio"),T("Practicar y estudiar redes","mini","Estudio"),T("Practicar y estudiar trading","mini","Estudio"),
T("Mirar lo de los grados y cátedras","mini","Trámites"),T("Esperar a que se habiliten las pruebas TyT","mini","Trámites"),
T("Ir al ITM a preguntar por la finalización del semestre","mini","Trámites",{desc:"Contacto: Yuli Catalina Montoya Díaz, auxiliar administrativa del departamento.\ncatalinamontoyad@itm.edu.co\nBloque L, piso 3, oficina 302, campus Fraternidad.\nTeléfono: 460 07 27, ext. 5554",fields:[{k:"Correo",v:"catalinamontoyad@itm.edu.co"},{k:"Ubicación",v:"Bloque L piso 3 oficina 302"},{k:"Teléfono",v:"460 07 27 ext. 5554"}]}),
T("Aplicación para registrar gastos (tipo Moneri)","mini","Proyectos"),T("Organizar GitHub","mini","Proyectos"),T("Revisar proyectos","mini","Proyectos"),
T("Hacerme los exámenes a finales de octubre","mini","Personal"),T("Que mi papá vaya al colegio de la niña","mini","Personal")]}}
var PW="",ready=false,tm;try{PW=localStorage.getItem("gestor-pw")||""}catch(e){}
function api(method,body,url){var c=new AbortController(),tm2=setTimeout(function(){c.abort()},20000);
 return fetch(url||"/api/data",{method:method,signal:c.signal,headers:{"Content-Type":"application/json","x-password":PW},body:body?JSON.stringify(body):undefined}).then(function(r){clearTimeout(tm2);
  if(r.status===401){var e=new Error("auth");e.auth=true;throw e}
  if(!r.ok)return r.text().then(function(x){throw new Error("Error "+r.status+": "+x.slice(0,200))});
  return r.json()})}
function save(){if(!ready)return;clearTimeout(tm);tm=setTimeout(function(){api("PUT",S).catch(function(){alert("No se pudo guardar. Revisa tu conexión.")})},400)}
$("#dlg").onchange=function(e){if(e.target.id!=="fin")return;var f=e.target.files[0];if(!f)return;if(f.size>3e6){alert("El archivo supera 3 MB.");return}pull();
 var rd=new FileReader();rd.onload=function(){api("POST",{name:f.name,type:f.type,data:String(rd.result).split(",")[1]},"/api/files").then(function(r){draft.files.push({id:r.id,name:f.name,size:f.size});dlg()}).catch(function(){alert("No se pudo subir el archivo.")})};rd.readAsDataURL(f)};
function showLogin(msg){$("#ttl").textContent="Entrar";$("#list").innerHTML='<div class="row"><input id="pw" type="password" placeholder="Contraseña" aria-label="Contraseña"><button class="p" id="go">Entrar</button></div>'+(msg?'<div class="empty">'+esc(msg)+'</div>':"");
 $("#pw").focus();function go(){PW=$("#pw").value;try{localStorage.setItem("gestor-pw",PW)}catch(e){}boot(PW?"Contraseña incorrecta":"")}$("#go").onclick=go;$("#pw").onkeydown=function(e){if(e.key==="Enter")go()}}
function boot(){$("#ttl").textContent="Cargando...";api("GET").then(function(d){ready=true;if(d.data)S=d.data;else save();render()}).catch(function(e){if(e.auth)showLogin(arguments.length&&PW?"Contraseña incorrecta":"");else{$("#ttl").textContent="No se pudo conectar";$("#list").innerHTML='<div class="empty">'+esc(e.name==="AbortError"?"La conexión tardó demasiado.":e.message)+'</div>'}})}

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(t){return t.done?"dn":!t.due?"no":new Date(t.due)<new Date()?"late":"up"}
var SN={all:"Todas",no:"Sin plazo",up:"Próximamente",late:"Vencida",dn:"Completada"};
function catOf(id){return S.cats.find(function(c){return c.id===id})||{name:"?",icon:"",color:"#888"}}
function fd(d){var x=new Date(d);return x.toLocaleDateString("es",{day:"numeric",month:"short"}).replace(".","")+", "+x.toLocaleTimeString("es",{hour:"numeric",minute:"2-digit"})}
function render(){
 var h='<h1>Mis tareas</h1><button class="cat '+(cur==="all"?"on":"")+'" data-c="all"><i style="background:var(--mu)"></i>Todas<span class="n">'+S.tasks.filter(function(t){return!t.done}).length+'</span></button>';
 S.cats.forEach(function(c){h+='<button class="cat '+(cur===c.id?"on":"")+'" data-c="'+c.id+'"><i style="background:'+esc(c.color)+'"></i>'+esc(c.icon)+" "+esc(c.name)+'<span class="n">'+S.tasks.filter(function(t){return t.cat===c.id&&!t.done}).length+'</span></button>'});
 h+='<button class="cat" data-c="+"><span style="color:var(--ac)">+ Nueva categoría</span></button>';
 $("#nav").innerHTML=h;
 var c=cur==="all"?null:catOf(cur);
 $("#ttl").innerHTML=c?esc(c.icon)+" "+esc(c.name):"Todas las tareas";
 var base=S.tasks.filter(function(t){return cur==="all"||t.cat===cur});
 $("#chips").innerHTML=Object.keys(SN).map(function(k){var n=k==="all"?base.length:base.filter(function(t){return st(t)===k}).length;return'<button data-f="'+k+'" class="'+(flt===k?"on":"")+'">'+SN[k]+" "+n+'</button>'}).join("")+(c?'<button class="d" data-delcat="1">Eliminar categoría</button>':"");
 var L=base.filter(function(t){var s=(t.title+" "+t.desc+" "+t.grp+" "+t.fields.map(function(f){return f.k+" "+f.v}).join(" ")).toLowerCase();return(flt==="all"||st(t)===flt)&&s.indexOf(q)>=0});
 var ord={late:0,up:1,no:2,dn:3};
 L.sort(function(a,b){return ord[st(a)]-ord[st(b)]||(a.due||"9").localeCompare(b.due||"9")});
 var groups={},keys=[];
 L.forEach(function(t){var k=cur==="all"?catOf(t.cat).icon+" "+catOf(t.cat).name+(t.grp?" › "+t.grp:""):(t.grp||"Sin grupo");if(!groups[k]){groups[k]=[];keys.push(k)}groups[k].push(t)});
 var o="";
 if(!L.length)o='<div class="empty">No hay tareas aquí. Agrega una arriba.</div>';
 keys.sort().forEach(function(k){o+='<div class="gh">'+esc(k)+'</div>';groups[k].forEach(function(t){
  var s=st(t),P={Alta:"pa",Media:"pm",Baja:"pb"};
  o+='<div class="row'+(t.done?" dn":"")+'"><input type="checkbox" data-k="'+t.id+'" '+(t.done?"checked":"")+' aria-label="Completar"><button class="t" data-o="'+t.id+'">'+esc(t.title)+'</button>'+(t.pri?'<span class="b '+P[t.pri]+'">'+t.pri+'</span>':"")+(((t.files||[]).length+(t.links||[]).length)?'<span class="b pb">📎 '+((t.files||[]).length+(t.links||[]).length)+'</span>':"")+(t.due?'<span class="b '+(s==="late"?"late":s==="dn"?"dn2":"up")+'">'+(s==="late"?"Vencida · ":"")+fd(t.due)+'</span>':"")+'</div>'})});
 $("#list").innerHTML=o;
}
$("#nav").onclick=function(e){var b=e.target.closest("[data-c]");if(!b)return;if(b.dataset.c==="+"){draft={name:"",icon:"📌",color:"#8e4ec6"};mode="cat";catDlg();$("#dlg").showModal();return}cur=b.dataset.c;render()};
$("#chips").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.f){flt=b.dataset.f;render()}if(b.dataset.delcat&&confirm("¿Eliminar esta categoría y todas sus tareas?")){S.tasks=S.tasks.filter(function(t){return t.cat!==cur});S.cats=S.cats.filter(function(c){return c.id!==cur});cur="all";save();render()}};
$("#q").oninput=function(){q=this.value.toLowerCase();render()};
function quick(){var v=$("#qa").value.trim();if(!v)return;var c=cur==="all"?S.cats[0]&&S.cats[S.cats.length-1].id:cur;S.tasks.push(T(v,c));$("#qa").value="";save();render()}
$("#qb").onclick=quick;$("#qa").onkeydown=function(e){if(e.key==="Enter")quick()};
$("#full").onclick=function(){draft=T($("#qa").value.trim(),cur==="all"?S.cats[0].id:cur);$("#qa").value="";mode="new";dlg();$("#dlg").showModal()};
$("#list").onclick=function(e){var t=e.target;
 if(t.dataset.k){var x=S.tasks.find(function(a){return a.id===t.dataset.k});x.done=t.checked;save();render()}
 if(t.dataset.o){draft=JSON.parse(JSON.stringify(S.tasks.find(function(a){return a.id===t.dataset.o})));mode="edit";dlg();$("#dlg").showModal()}};
function dlg(){var a=draft;a.links=a.links||[];a.files=a.files||[];var opt=function(v,l,s){return'<option value="'+esc(v)+'"'+(s?" selected":"")+'>'+esc(l)+'</option>'};
 var h='<h3 style="margin:0">'+(mode==="new"?"Nueva tarea":"Detalle de la tarea")+'</h3>';
 if(mode==="edit")h+='<span class="b '+(st(a)==="late"?"late":st(a)==="dn"?"dn2":"up")+'" style="display:inline-block;margin-top:6px">'+SN[st(a)==="no"?"no":st(a)]+'</span>';
 h+='<label for="f-title">Título</label><input id="f-title" value="'+esc(a.title)+'">';
 h+='<div class="g2"><div><label for="f-cat">Categoría</label><select id="f-cat">'+S.cats.map(function(c){return opt(c.id,c.icon+" "+c.name,c.id===a.cat)}).join("")+'</select></div>';
 h+='<div><label for="f-grp">Grupo (opcional)</label><input id="f-grp" list="gl" value="'+esc(a.grp)+'"><datalist id="gl">'+Array.from(new Set(S.tasks.map(function(t){return t.grp}).filter(Boolean))).map(function(g){return'<option value="'+esc(g)+'">'}).join("")+'</datalist></div></div>';
 h+='<div class="g2"><div><label for="f-due">Fecha límite (opcional)</label><input type="datetime-local" id="f-due" value="'+esc(a.due)+'"></div>';
 h+='<div><label for="f-pri">Prioridad</label><select id="f-pri">'+["","Alta","Media","Baja"].map(function(p){return opt(p,p||"Sin prioridad",p===a.pri)}).join("")+'</select></div></div>';
 h+='<label for="f-desc">Descripción y notas</label><textarea id="f-desc" rows="4">'+esc(a.desc)+'</textarea><label>Campos personalizados</label>';
 a.fields.forEach(function(f,i){h+='<div class="cf"><input data-fk="'+i+'" placeholder="Nombre" value="'+esc(f.k)+'" aria-label="Nombre del campo"><input data-fv="'+i+'" placeholder="Valor" value="'+esc(f.v)+'" aria-label="Valor del campo"><button class="d" data-fr="'+i+'" aria-label="Quitar campo">✕</button></div>'});
 h+='<button id="addf">Agregar campo</button>'+attHtml(a)+'<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button id="gcal">Añadir a Google Calendar</button><button id="ics">Descargar .ics (Apple, Outlook)</button></div><div class="foot"><div>'+(mode==="edit"?'<button class="d" id="del">Eliminar</button> ':"")+'<button id="cl">Cerrar</button></div><button class="p" id="sv">Guardar cambios</button></div>';
 $("#dlg").innerHTML=h}
function catDlg(){var a=draft;$("#dlg").innerHTML='<h3 style="margin:0">Nueva categoría</h3><div class="g2"><div><label for="c-n">Nombre</label><input id="c-n" value="'+esc(a.name)+'"></div><div><label for="c-i">Emoji</label><input id="c-i" value="'+esc(a.icon)+'" maxlength="4"></div></div><label for="c-c">Color</label><input type="color" id="c-c" value="'+a.color+'"><div class="foot"><button id="cl">Cerrar</button><button class="p" id="cs">Crear categoría</button></div>'}
function pad(n){return String(n).padStart(2,"0")}
function stamp(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"}
function range(due){var a=new Date(due);return[stamp(a),stamp(new Date(a.getTime()+36e5))]}
function details(t){return[t.desc].concat(t.fields.map(function(f){return f.k+": "+f.v})).concat(t.links||[]).filter(Boolean).join("\n")}
function ie(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function attHtml(a){var h='<label>Links</label>';
 a.links.forEach(function(l,i){h+='<div class="cf" style="grid-template-columns:1fr auto auto"><input data-lk="'+i+'" placeholder="https://..." value="'+esc(l)+'" aria-label="Link"><button data-lo="'+i+'" aria-label="Abrir link">↗</button><button class="d" data-lr="'+i+'" aria-label="Quitar link">✕</button></div>'});
 h+='<button id="addl">Agregar link</button><label>Archivos (máx. 3 MB)</label>';
 a.files.forEach(function(f,i){h+='<div class="cf" style="grid-template-columns:1fr auto auto"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center">📎 '+esc(f.name)+' <small style="color:var(--mu)">'+Math.max(1,Math.round(f.size/1024))+' KB</small></span><button data-fo="'+i+'">Abrir</button><button class="d" data-ff="'+i+'" aria-label="Quitar archivo">✕</button></div>'});
 return h+'<button id="addfile">Adjuntar archivo</button><input type="file" id="fin" hidden>'}
function pull(){["title","cat","grp","due","pri","desc"].forEach(function(k){var el=$("#f-"+k);if(el)draft[k]=el.value});
 document.querySelectorAll("[data-lk]").forEach(function(el){draft.links[el.dataset.lk]=el.value});
 document.querySelectorAll("[data-fk]").forEach(function(el){draft.fields[el.dataset.fk].k=el.value});
 document.querySelectorAll("[data-fv]").forEach(function(el){draft.fields[el.dataset.fv].v=el.value})}
$("#dlg").onclick=function(e){var t=e.target,id=t.id;
 if(id==="cl"){$("#dlg").close();return}
 if(id==="cs"){var n=$("#c-n").value.trim();if(!n){$("#c-n").focus();return}var c={id:"c"+Date.now().toString(36),name:n,icon:$("#c-i").value||"📌",color:$("#c-c").value};S.cats.push(c);cur=c.id;save();$("#dlg").close();render();return}
 if(t.dataset.fr!==undefined){pull();draft.fields.splice(+t.dataset.fr,1);dlg();return}
 if(id==="addf"){pull();draft.fields.push({k:"",v:""});dlg();var ks=document.querySelectorAll("[data-fk]");ks[ks.length-1].focus();return}
 if(id==="addl"){pull();draft.links.push("");dlg();var lk=document.querySelectorAll("[data-lk]");lk[lk.length-1].focus();return}
 if(t.dataset.lr!==undefined){pull();draft.links.splice(+t.dataset.lr,1);dlg();return}
 if(t.dataset.lo!==undefined){pull();var u=(draft.links[+t.dataset.lo]||"").trim();if(!u)return;if(!/^https?:\/\//i.test(u))u="https://"+u;window.open(u,"_blank","noopener");return}
 if(id==="addfile"){$("#fin").click();return}
 if(t.dataset.fo!==undefined){var f=draft.files[+t.dataset.fo];fetch("/api/files?id="+f.id,{headers:{"x-password":PW}}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;a.click()}).catch(function(){alert("No se pudo abrir el archivo.")});return}
 if(t.dataset.ff!==undefined){pull();var rm=draft.files.splice(+t.dataset.ff,1)[0];(draft._del=draft._del||[]).push(rm.id);dlg();return}
 if(id==="gcal"||id==="ics"){pull();if(!draft.due){alert("Primero elige una fecha límite.");return}var r=range(draft.due);
 if(id==="gcal"){window.open("https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(draft.title)+"&dates="+r[0]+"/"+r[1]+"&details="+encodeURIComponent(details(draft)),"_blank");return}
